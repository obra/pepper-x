[package]
name = "pepperx-platform-gnome"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
glib = "0.22.3"
libc = "0.2"
pepperx-ipc = { path = "../pepperx-ipc" }
pepperx-session = { path = "../pepperx-session" }
zbus = { version = "5.16", default-features = false, features = ["async-io", "blocking-api"] }
