[package]
name = "pepper-x-app"
version = "1.0.0"
edition = "2021"
publish = false

[[bin]]
name = "pepper-x"
path = "src/main.rs"

[features]
default = ["cuda"]
cuda = ["pepperx-asr/cuda"]

[dependencies]
async-channel = "2.5"
adw = { package = "libadwaita", version = "0.9.1", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11.1", features = ["gnome_46"] }
pepperx-asr = { path = "../crates/pepperx-asr", default-features = false }
pepperx-audio = { path = "../crates/pepperx-audio" }
pepperx-cleanup = { path = "../crates/pepperx-cleanup" }
pepperx-corrections = { path = "../crates/pepperx-corrections" }
pepperx-ipc = { path = "../crates/pepperx-ipc" }
pepperx-models = { path = "../crates/pepperx-models" }
pepperx-platform-gnome = { path = "../crates/pepperx-platform-gnome" }
pepperx-session = { path = "../crates/pepperx-session" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
zbus = { version = "5.13", default-features = false, features = ["async-io"] }
